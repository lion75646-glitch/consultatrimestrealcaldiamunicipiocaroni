<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta y Pago de Trimestres Vehiculares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1a365d;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 0.5rem 0 0;
            color: #cbd5e1;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #1e293b;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Consulta y Pago de Trimestres Vehiculares</h1>
        <p>Alcaldía del Municipio Caroní</p>
    </header>

    <div class="container">
        <h2>Consultar Estado del Vehículo</h2>
        <form>
            <div class="form-group">
                <label for="placa">Ingrese la Placa o Cédula:</label>
                <input type="text" id="placa" placeholder="Ej. ABC123D o V-12345678" required>
            </div>
            <button type="submit">Consultar Estado</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
